version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    # Group updates to prevent repetitive alert and PR notifications
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
      development-dependencies:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
